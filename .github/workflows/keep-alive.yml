name: Keep Alive Render Server

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 minutes)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging https://ritesh-wpda.onrender.com/health..."
          curl -s -f -m 30 https://ritesh-wpda.onrender.com/health || echo "Ping attempted"
